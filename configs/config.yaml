env: development

http:
  host: 0.0.0.0
  port: 8080

websocket:
  path: /ws
  read_buffer_size: 1024
  write_buffer_size: 1024

postgres:
  host: localhost
  port: 5432
  user: option_engine
  password: option_engine
  database: option_engine
  ssl_mode: disable
  max_conns: 10
  min_conns: 2
  max_conn_lifetime: 30m

logging:
  level: debug
  format: json

shutdown:
  timeout: 15s

market:
  provider: csv
  mock:
    tick_interval: 1s
    seed: 1
  replay:
    start_time: "2024-01-15T09:15:00+05:30"
    speed: 1.0
  csv:
    enabled: true
    root_directory: data/raw
    symbol: NIFTY50
    exchange: NSE
    timeframe: 5m
    replay_speed: instant
    loop: false
    publish_delay: false
    batch_size: 1000
  groww:
    enabled: false
    api_key: "eyJraWQiOiJaTUtjVXciLCJhbGciOiJFUzI1NiJ9..TRjezjH09E4CC3IYCwcIZ45_fdOfiQNr--VrQoQD-LmpIKlDhrAbyJw4E2_bzFYSeoBIvH4KwE1vQvzGlk1YFA"
    api_secret: "lfRQYN-mC9xMIW5sn9kuZ_!v9&b9Kt#m"
    access_token: "eyJraWQiOiJaTUtjVXciLCJhbGciOiJFUzI1NiJ9..tSGiacrCBRfRSIf5ungI2yDSV2bUGbzJ8W7KAioyScHG8IjkPxwxxWb_rRXEkRsYiWzVYcZ5sqcv_NfWwh8KLQ"
    base_url: https://api.groww.in
    requests_per_second: 5
    retry_attempts: 3
    retry_backoff_ms: 500
    replay_speed: realtime
    candle_interval: 5minute
    timeframe: 5m
    exchange: NSE
    segment: CASH
    start_time: "2026-08-01T09:15:00+05:30"
    end_time: "2026-08-27T15:30:00+05:30"

provider:
  reconnect:
    interval: 5s
    max_retries: -1

heartbeat:
  interval: 10s

subscription:
  batch_size: 200

event_bus:
  subscriber_buffer: 1024

validation:
  max_tick_age: 30s

calendar:
  timezone: Asia/Kolkata
  regular_open: "09:15"
  regular_close: "15:30"
  muhurat_open: "18:00"
  muhurat_close: "19:15"
  early_close_at: "13:00"
  expiry_weekday: 4
  holidays:
    - "2024-01-26"
    - "2024-03-08"
  muhurat_days:
    - "2024-11-01"
  early_close_days:
    - "2024-10-31"

symbols:
  file: configs/symbols.yaml

analytics:
  candle:
    enabled: true
    timeframes:
      - 1m
      - 5m
    timezone: Asia/Kolkata
    subscriber_buffer: 256
    flush_on_shutdown: true
    volume_mode: cumulative
    order_policy: reject_older
    idle_evict_after: 0s

  indicator:
    enabled: true
    subscriber_buffer: 256
    ema:
      - period: 9
      - period: 21
    sma:
      - period: 20
    rsi:
      - period: 14
    atr:
      - period: 14
    macd:
      fast_period: 12
      slow_period: 26
      signal_period: 9
    bollinger:
      period: 20
      stddev: 2.0

  signal:
    enabled: true
    ema_cross:
      enabled: true
      fast_period: 9
      slow_period: 21
    macd_cross:
      enabled: true
    rsi:
      enabled: true
      oversold: 30
      overbought: 70
    bollinger:
      enabled: true

  strategy:
    enabled: true
    trend_following:
      enabled: true
    mean_reversion:
      enabled: true
    breakout:
      enabled: false

  risk:
    enabled: true
    min_confidence: 0.70
    max_positions: 5
    max_trades_per_day: 20

  performance:
    enabled: true

execution:
  paper:
    enabled: true
    slippage_percent: 0.05
    default_price: market

portfolio:
  enabled: true

backtest:
  enabled: false
  speed: 1x
  symbols:
    - NIFTY
  timeframe: 1m

optimization:
  enabled: true
  scoring:
    profit_factor_weight: 0.40
    win_rate_weight: 0.30
    expectancy_weight: 0.20
    drawdown_penalty: 0.10

experiments:
  enabled: true
  parallel_workers: 4
  max_concurrent_runs: 4
  symbols:
    - NIFTY
  timeframes:
    - 5m
  parameter_ranges:
    ema_fast:
      - 5
      - 9
      - 12
    ema_slow:
      - 21
      - 34
      - 50
    rsi_period:
      - 14
      - 21

walkforward:
  enabled: false
  train_window_days: 30
  validation_window_days: 10
  step_days: 10

montecarlo:
  enabled: true
  simulations: 1000
  confidence_level: 0.95
  random_seed: 42

research:
  enabled: true
  export_directory: ./reports
  formats:
    - json
    - csv

scanner:
  enabled: true
  symbols:
    - NIFTY
  scanners:
    ema: true
    rsi: true
    macd: true
    trend: true
    ranking: true

intelligence:
  opportunity:
    enabled: true
    top_n: 20
    weights:
      signal: 0.20
      strategy: 0.20
      performance: 0.15
      optimization: 0.15
      walkforward: 0.15
      montecarlo: 0.15

  recommendation:
    enabled: true
    strong_buy_threshold: 0.85
    buy_threshold: 0.70
    watch_threshold: 0.40

  validation:
    enabled: true
    min_confidence: 0.15
    min_optimization_score: 0.60
    min_walkforward_score: 0.60
    min_montecarlo_score: 0.60
    min_win_rate: 0.50
    max_drawdown: 0.20
    freshness_seconds: 300
    suppress_duplicates: true

  recommendation_state:
    enabled: true
    subscriber_buffer: 256
    max_active: 10000

  alerts:
    enabled: true
    subscriber_buffer: 256
    confidence_change_threshold: 0.05
    cooldown_seconds: 300

  explanation:
    enabled: true
    include_timeline: true
    include_research: true
    include_confidence_breakdown: true

quality:
  enabled: true
  subscriber_buffer: 256
  tracking_timeout_minutes: 120

  # Classification thresholds
  excellent_threshold: 0.90
  good_threshold: 0.75
  average_threshold: 0.50

  # Outcome thresholds (decimal returns: (exit-entry)/entry)
  success_return_pct: 0.005
  failure_return_pct: -0.005

  # Quality scoring
  mfe_weight: 0.20
  mae_weight: 0.15
  duration_weight: 0.10
  confidence_weight: 0.10
  outcome_weight: 0.10
  return_weight: 0.30
  level_weight: 0.05

  feedback:
    enabled: true
    subscriber_buffer: 256

  delivery:
    enabled: true
    subscriber_buffer: 512

console:
  enabled: true
  refresh_interval: 1s

backtest_runner:
  enabled: true
  auto_start: false
  concurrent_sessions: 1

laboratory:
  enabled: true
  auto_version: true
  concurrent_studies: 1

airesearch:
  enabled: true
  analyzer: rule_based

aicontext:
  enabled: true
  executive_prompt: true
  technical_prompt: true
  json_prompt: true

api:
  enabled: true
  prefix: /api/v1
  read_timeout: 30s
  write_timeout: 30s
