env: development

http:
  host: 0.0.0.0
  port: 8080

websocket:
  path: /ws
  read_buffer_size: 1024
  write_buffer_size: 1024

postgres:
  host: localhost
  port: 5432
  user: option_engine
  password: option_engine
  database: option_engine
  ssl_mode: disable
  max_conns: 10
  min_conns: 2
  max_conn_lifetime: 30m

logging:
  level: info
  format: json

shutdown:
  timeout: 15s

market:
  provider: mock
  mock:
    tick_interval: 1s
    seed: 1
  replay:
    start_time: "2024-01-15T09:15:00+05:30"
    speed: 1.0

provider:
  reconnect:
    interval: 5s
    max_retries: -1

heartbeat:
  interval: 10s

subscription:
  batch_size: 200

event_bus:
  subscriber_buffer: 1024

validation:
  max_tick_age: 30s

calendar:
  timezone: Asia/Kolkata
  regular_open: "09:15"
  regular_close: "15:30"
  muhurat_open: "18:00"
  muhurat_close: "19:15"
  early_close_at: "13:00"
  expiry_weekday: 4
  holidays:
    - "2024-01-26"
    - "2024-03-08"
  muhurat_days:
    - "2024-11-01"
  early_close_days:
    - "2024-10-31"

symbols:
  file: configs/symbols.yaml

analytics:
  candle:
    enabled: true
    timeframes:
      - 1m
      - 5m
    timezone: Asia/Kolkata
    subscriber_buffer: 256
    flush_on_shutdown: true
    volume_mode: cumulative
    order_policy: reject_older
    idle_evict_after: 0s

  indicator:
    enabled: true
    subscriber_buffer: 256
    ema:
      - period: 9
      - period: 21
    sma:
      - period: 20
    rsi:
      - period: 14
    atr:
      - period: 14
    macd:
      fast_period: 12
      slow_period: 26
      signal_period: 9
    bollinger:
      period: 20
      stddev: 2.0

  signal:
    enabled: true
    ema_cross:
      enabled: true
      fast_period: 9
      slow_period: 21
    macd_cross:
      enabled: true
    rsi:
      enabled: true
      oversold: 30
      overbought: 70
    bollinger:
      enabled: true

  strategy:
    enabled: true
    trend_following:
      enabled: true
    mean_reversion:
      enabled: true
    breakout:
      enabled: false

  risk:
    enabled: true
    min_confidence: 0.70
    max_positions: 5
    max_trades_per_day: 20

  performance:
    enabled: true

execution:
  paper:
    enabled: true
    slippage_percent: 0.05
    default_price: market

portfolio:
  enabled: true

backtest:
  enabled: false
  speed: 1x
  symbols:
    - NIFTY
  timeframe: 1m

optimization:
  enabled: true
  scoring:
    profit_factor_weight: 0.40
    win_rate_weight: 0.30
    expectancy_weight: 0.20
    drawdown_penalty: 0.10

experiments:
  enabled: true
  parallel_workers: 4
  max_concurrent_runs: 4
  symbols:
    - NIFTY
  timeframes:
    - 5m
  parameter_ranges:
    ema_fast:
      - 5
      - 9
      - 12
    ema_slow:
      - 21
      - 34
      - 50
    rsi_period:
      - 14
      - 21

walkforward:
  enabled: false
  train_window_days: 30
  validation_window_days: 10
  step_days: 10

montecarlo:
  enabled: true
  simulations: 1000
  confidence_level: 0.95
  random_seed: 42
